name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions: {}

env:
  COPIER_VERSION: "9.19.1"
  RENDER_DIR: rendered

jobs:
  template:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rendered
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Render template
      working-directory: .
      run: pipx run --spec "copier==$COPIER_VERSION" copier copy --vcs-ref=HEAD --defaults --quiet . "$RENDER_DIR"

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: rendered/go.mod
        cache-dependency-path: rendered/go.sum

    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.15.0
        install-mode: goinstall
        working-directory: rendered

    - name: Build
      run: go build -v ./...

    - name: Test with coverage
      run: go test -v -coverprofile=coverage.out ./...

    - name: Enforce coverage threshold
      env:
        COVERAGE_THRESHOLD: "0"
      run: ./scripts/coverage_check.sh ./coverage.out "$COVERAGE_THRESHOLD"

    - name: Run
      run: go run ./src/main.go
