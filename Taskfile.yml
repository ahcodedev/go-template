version: '3'

vars:
  RENDER_DIR: rendered

tasks:
  render:
    desc: Render the template with default answers into ./{{.RENDER_DIR}}
    cmds:
      - rm -rf {{.RENDER_DIR}}
      - copier copy --vcs-ref=HEAD --defaults --quiet . {{.RENDER_DIR}}

  build:
    desc: Build the rendered template
    deps: [render]
    cmds:
      - task -d {{.RENDER_DIR}} build

  test:
    desc: Run unit tests in the rendered template
    deps: [render]
    cmds:
      - task -d {{.RENDER_DIR}} test

  coverage:
    desc: Run unit tests with code coverage in the rendered template
    deps: [render]
    cmds:
      - task -d {{.RENDER_DIR}} coverage

  lint:
    desc: Lint the rendered template
    deps: [render]
    cmds:
      - task -d {{.RENDER_DIR}} lint

  gitleaks:
    desc: Scan git history for secrets
    cmds:
      - gitleaks git --redact --verbose .

  zizmor:
    desc: Audit workflows and Dependabot config in the repo and the template
    cmds:
      - zizmor . template

  security:
    desc: Run all security checks
    cmds:
      - task: gitleaks
      - task: zizmor
